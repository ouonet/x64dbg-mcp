name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # ── TypeScript build + test + lint ────────────────────────────────────────
  ts:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ── Python syntax + logic tests ───────────────────────────────────────────
  python:
    name: Python bridge
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile plugin/x64dbg_mcp_bridge.py
          python -m py_compile plugin/x64dbg_bridge_sdk.py

      - name: Logic tests
        run: python plugin/tests/test_bridge.py

  # ── C loader build (both architectures) ──────────────────────────────────
  loader:
    name: C loader
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -B plugin/loader/build64 -A x64 -S plugin/loader

      - name: Build x64
        run: cmake --build plugin/loader/build64 --config Release

      - name: Configure x32
        run: cmake -B plugin/loader/build32 -A Win32 -S plugin/loader -DBUILD_32BIT=ON

      - name: Build x32
        run: cmake --build plugin/loader/build32 --config Release

      - name: Copy to prebuilt/
        run: |
          New-Item -ItemType Directory -Force -Path plugin/loader/prebuilt
          Copy-Item plugin/loader/build64/Release/x64dbg_mcp_loader.dp64 plugin/loader/prebuilt/
          Copy-Item plugin/loader/build32/Release/x64dbg_mcp_loader.dp32 plugin/loader/prebuilt/

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-loaders
          path: plugin/loader/prebuilt/
          if-no-files-found: error

  # ── Release: publish to npm with prebuilt binaries ────────────────────────
  release:
    name: Publish to npm
    # 强烈建议改为 ubuntu-latest 以确保 npm provenance 签名 100% 成功
    runs-on: ubuntu-latest 
    needs: [ts, python, loader]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: x64dbg
    
    # 必须同时声明以下两个权限
    permissions:
      id-token: write      # OIDC 换取 npm 凭证必填
      contents: read       # 允许 checkout 步骤读取代码（必须加）

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 移除了 registry-url，让 OIDC 机制完全接管
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Download prebuilt loaders
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-loaders
          # 如果换成 ubuntu-latest，注意检查路径的大小写和斜杠
          path: plugin/loader/prebuilt/

      - name: Publish to npm (via OIDC)
        # 精简了发布命令，直接带上 --provenance 即可
        run: npm publish --access public --provenance
